<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title and page.url != "/" %} - {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ site.logo_image | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.header_image and site.header_image != "" %}
  <style>.banner { background-image: url("{{ site.header_image | relative_url }}"); }</style>
  {% endif %}
</head>
<body>
  <div class="page">
    {% include header.html %}

    <main class="panel content">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
